<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgChrono" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="cyanBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="goldGear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bgChrono)" />
  
  <!-- 時空の羅針盤リング -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGear)" stroke-width="6" stroke-dasharray="20 10" opacity="0.85" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#06b6d4" stroke-width="4" stroke-dasharray="8 12" opacity="0.7" />
  <circle cx="256" cy="256" r="155" fill="none" stroke="#10b981" stroke-width="2" opacity="0.5" />

  <!-- 羅針盤の十字星 -->
  <polygon points="256,45 272,240 467,256 272,272 256,467 240,272 45,256 240,240" fill="url(#goldGear)" opacity="0.35" />

  <!-- クロノ・シールド -->
  <path d="M 256,95 Q 375,110 385,210 Q 385,345 256,430 Q 127,345 127,210 Q 137,110 256,95 Z" fill="#042f2e" stroke="url(#goldGear)" stroke-width="8" opacity="0.95" />

  <!-- 時空聖剣 -->
  <g filter="url(#glow)">
    <path d="M 256,65 L 278,300 L 256,330 L 234,300 Z" fill="url(#cyanBlade)" />
    <line x1="256" y1="65" x2="256" y2="320" stroke="#ffffff" stroke-width="4" />
    <path d="M 175,295 Q 256,335 337,295 L 325,325 Q 256,350 187,325 Z" fill="url(#goldGear)" />
    <rect x="247" y="328" width="18" height="58" rx="5" fill="#78350f" />
    <circle cx="256" cy="400" r="18" fill="url(#goldGear)" />
    <circle cx="256" cy="400" r="8" fill="#06b6d4" />
  </g>

  <text x="256" y="245" font-family="sans-serif" font-size="72" font-weight="900" fill="url(#goldGear)" text-anchor="middle" filter="url(#glow)">III</text>
</svg>
