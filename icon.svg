<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="emeraldSword" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="#f59e0b" stroke-width="6" stroke-dasharray="14 8" opacity="0.8"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10b981" stroke-width="3" opacity="0.6"/>

  <!-- シールド -->
  <path d="M 256,95 Q 370,105 390,200 Q 390,340 256,430 Q 122,340 122,200 Q 142,105 256,95 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="8" opacity="0.9"/>

  <!-- 聖剣 -->
  <g filter="url(#glow)">
    <path d="M 256,75 L 274,300 L 256,325 L 238,300 Z" fill="url(#emeraldSword)"/>
    <line x1="256" y1="75" x2="256" y2="315" stroke="#ffffff" stroke-width="3.5"/>
    <path d="M 190,305 Q 256,330 322,305 L 312,328 Q 256,340 200,328 Z" fill="url(#goldGrad)"/>
    <rect x="248" y="328" width="16" height="55" rx="4" fill="#78350f"/>
    <circle cx="256" cy="395" r="16" fill="url(#goldGrad)"/>
    <circle cx="256" cy="395" r="7" fill="#10b981"/>
  </g>

  <!-- 3級の「III」刻印 -->
  <text x="256" y="245" font-family="sans-serif" font-size="68" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)">III</text>
</svg>
